<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
    <title>{{ title }}</title>
</head>
<style type="text/css">
    body {
        margin: 0;
        padding-left: 10%;
        padding-right: 10%;
        font-family: sans-serif;
    }

    .mainTable {
        /* width: 100%;
        border: solid 1px lightslategray;
        font-family: sans-serif;
        font-size: 10pt;
        text-align: left;
        vertical-align: top; */
        border-collapse: collapse;
        margin: 25px 0;
        font-size: 0.9em;
        font-family: sans-serif;
        /* min-width: 400px; */
        width: 100%;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.15);
    }

    .mainTable thead tr {
        background-color: #52b5ff;
        color: #ffffff;
        text-align: left;
    }

    .mainTable th,
    .mainTable td {
        padding: 12px 15px;
        width: 10px;
    }

    .mainTable tbody tr {
        border-bottom: 1px solid #dddddd;
    }

    .mainTable tbody tr:nth-of-type(even) {
        background-color: #f3f3f3;
    }

    .mainTable tbody tr:last-of-type {
        border-bottom: 2px solid #52b5ff;
    }

    td {
        border-right: 1px solid rgb(207, 207, 207);
    }

    /* td,
    th {
      padding: 5px;
    } */

    a {
        color: black;
        font-weight: 600;
        text-decoration: none;
    }

    a:hover {
        color: rgb(158, 209, 226);
        text-decoration: underline;
    }

</style>
<body>
<h2>DOPUNE / LISTE</h2>
<form action="/upload" method="post" enctype="multipart/form-data">
    <table class="mainTable" cellspacing="0">
        <tbody>
        <thead>
        <tr>
            <th class="header">Ime datoteke</th>
            <th class="header">Veličina</th>
            <th class="header">Vreme unosa</th>

        </tr>
        </thead>
       {% for pdf in pdf_list %}
        <tr>
            <td><input type="checkbox" name="filesForDeletion" value="{{ escape(pdf['name']) }}"/> &nbsp; <a href="https://dopune.betroyal.casino/files/{{ escape(pdf['name']) }}">{{ escape(pdf['name']) }}</a></td>
            <td>{{ escape(pdf['size']) }}</td>
            <td>{{ escape(pdf['created']) }}</td>
        </tr>
       {% end %}
        </tbody>
    </table>

    <table class="mainTable" border="1">
        <tbody>
        <tr>
            <td> Nova datoteka: <input type="file" name="uploadedFile" multiple/>
                <button type="submit" name="action" value="upload" >Upload</button>
            </td>
            <td class="checkFile">
                <button type="submit" name="action" value="delete" >Obrisi</button>
            </td>
        </tr>
        </tbody>
    </table>
</form>


<div id="copyright"></div>

<script>
  const paragraph = `
  <p>
    Copyright &copy; ${new Date().getFullYear()} premierbet.me
  </p>`;

  document.getElementById('copyright').innerHTML = paragraph;
</script>
</body>
</html>
